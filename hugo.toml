baseURL = 'https://anshu92.github.io/'
languageCode = 'en-us'
title = 'Synaptic Radio'
theme = 'stack'

# Copyright notice
copyright = 'Anshuman Sahoo'

# Params
[params]
mainSections = ['post']
featuredImageField = 'image'
rssFullContent = true
favicon = '/img/synaptic-radio-favicon.svg'

# Author configuration
[params.author]
name = 'Anshuman Sahoo'
bio = "I'm Anshu, a principal ML engineer working on foundation models, agentic systems and scientific AI. I write about the math, systems and engineering judgement behind turning research ideas into reliable production workflows."
email = 'anshuman264@gmail.com'

# Sidebar configuration
[params.sidebar]
subtitle = "Principal ML engineer focused on foundation models, agentic systems and scientific AI. I write about the math, systems and engineering judgement behind reliable ML workflows."
compact = false

[params.sidebar.avatar]
enabled = true
local = false
src = "/img/synaptic-radio-logo.svg"

# Article configuration
[params.article]
math = true
readingTime = true
license.enabled = false

# Comments (disabled by default)
[params.comments]
enabled = false

# Global article likes. Leave empty for local browser-only counts.
[params.likes]
workerURL = ""

# Widget configuration
[params.widgets]
homepage = [
    { type = "search" },
    { type = "categories", params = { limit = 10 } },
    { type = "tag-cloud", params = { limit = 10 } }
]
page = [
    { type = "toc" }
]

# Default image
[params.defaultImage]
opengraph.enabled = false
article.enabled = false

# Menu configuration
[[menu.main]]
identifier = 'home'
name = 'Home'
url = '/'
weight = -100
[[menu.main]]
identifier = 'start-here'
name = 'Start Here'
url = '/page/start-here/'
weight = -90
[[menu.main]]
identifier = 'curriculum'
name = 'Curriculum'
url = '/page/curriculum/'
weight = -80
[[menu.main]]
identifier = 'research-reports'
name = 'Research Reports'
url = '/page/research-reports/'
weight = -70
[[menu.main]]
identifier = 'labs'
name = 'Labs'
url = '/page/labs/'
weight = -60
[[menu.main]]
identifier = 'artifacts'
name = 'Artifacts'
url = '/page/artifacts/'
weight = -50
[[menu.main]]
identifier = 'reading-map'
name = 'Reading Map'
url = '/page/reading-map/'
weight = -40
[[menu.main]]
identifier = 'about'
name = 'About'
url = '/page/about/'
weight = -30

# Social menu configuration
[[menu.social]]
identifier = 'linkedin'
name = 'LinkedIn'
url = 'https://www.linkedin.com/in/anshu92/'
params = { icon = 'brand-linkedin' }

# Related content
[related]
includeNewer = true
threshold = 60
toLower = false
[[related.indices]]
name = 'keywords'
weight = 100
[[related.indices]]
name = 'tags'
weight = 80
[[related.indices]]
name = 'categories'
weight = 60
[[related.indices]]
name = 'date'
weight = 10

# Markup configuration
[markup]
[markup.goldmark.renderer]
unsafe = true
[markup.goldmark.extensions.passthrough]
enable = true
[markup.goldmark.extensions.passthrough.delimiters]
block = [['\[', '\]'], ['$$', '$$']]
inline = [['\(', '\)'], ['$', '$']]
[markup.tableOfContents]
endLevel = 4
ordered = true
startLevel = 2
[markup.highlight]
noClasses = false
codeFences = true
guessSyntax = true
lineNoStart = 1
lineNos = true
lineNumbersInTable = true
style = 'github'
tabWidth = 4
