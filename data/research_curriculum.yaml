version: "2026.1"
title: "Synaptic Radio LLM Research Engineer Curriculum"
subtitle: "A public, self-directed apprenticeship in trustworthy LLM research engineering"
research_baseline: "2026-08-20"
start_date: "2026-08-24"
target_end_date: "2027-08-22"
duration_weeks: 52
module_count: 12
report_count: 14
weekly_hours: "8-12"
code_repository:
  name: "synaptic-lm-lab"
  current_url: "https://github.com/anshu92/synaptic-radio-code"
  target_url: "https://github.com/anshu92/synaptic-lm-lab"
  migration_status: "planned"

workflow:
  - id: research
    label: "Research"
    description: "Read primary material and derive the mechanism before consulting production implementations."
  - id: preregister
    label: "Preregister"
    description: "Commit the hypothesis, controls, metrics, compute limit, and stopping rule before the main run."
  - id: implement
    label: "Implement"
    description: "Build the smallest trustworthy reference implementation personally."
  - id: validate
    label: "Validate"
    description: "Add unit, equivalence, negative-control, and failure-injection tests."
  - id: experiment
    label: "Experiment"
    description: "Run controlled comparisons while retaining configurations, seeds, raw results, and failed-run compute."
  - id: reproduce
    label: "Reproduce"
    description: "Repeat the result from a clean environment or fresh notebook session."
  - id: write
    label: "Write"
    description: "Write only from retained evidence, including negative and inconclusive results."
  - id: publish
    label: "Publish"
    description: "Tag the code and link immutable manifests, results, and reproduction commands."

evidence_levels:
  - id: not-started
    label: "Not started"
    description: "The work is scheduled but no evidence has been claimed."
  - id: derived
    label: "Derived"
    description: "The mechanism, invariants, and expected failure signatures are documented."
  - id: implemented
    label: "Implemented"
    description: "A tested reference implementation exists."
  - id: validated
    label: "Validated"
    description: "Controlled experiments and negative controls support the bounded claim."
  - id: scaled
    label: "Scaled"
    description: "The claim is supported by meaningful multi-GPU or larger-scale execution."
  - id: transferred
    label: "Transferred"
    description: "The conclusion survives an out-of-distribution or downstream setting."

result_states:
  - planned
  - preregistered
  - running
  - published
  - deferred

reading_stack:
  - id: cs336
    title: "Stanford CS336: Language Modeling from Scratch"
    url: "https://cs336.stanford.edu/"
    role: "Canonical curriculum spine and assignments"
  - id: nanochat
    title: "nanochat"
    url: "https://github.com/karpathy/nanochat"
    role: "Minimal end-to-end comparison after the mechanism is implemented"
  - id: olmo
    title: "OLMo and OLMo-core"
    url: "https://allenai.org/olmo"
    role: "Transparent production-oriented lifecycle reference"
  - id: tuning-playbook
    title: "Deep Learning Tuning Playbook"
    url: "https://github.com/google-research/tuning_playbook"
    role: "Experimental discipline, baselines, and tuning order"
  - id: datacomp-lm
    title: "DataComp-LM"
    url: "https://arxiv.org/abs/2406.11794"
    role: "Controlled pretraining-data experiments"
  - id: cuda
    title: "CUDA Programming Guide"
    url: "https://docs.nvidia.com/cuda/cuda-programming-guide/"
    role: "GPU execution and memory model"
  - id: pytorch-distributed
    title: "PyTorch distributed tensor documentation"
    url: "https://docs.pytorch.org/docs/stable/distributed.tensor.html"
    role: "DTensor, FSDP2, and tensor-parallel reference"
  - id: rlhf-book
    title: "The RLHF Book"
    url: "https://rlhfbook.com/"
    role: "LLM post-training objectives and lifecycle"
  - id: inspect
    title: "Inspect AI"
    url: "https://inspect.aisi.org.uk/"
    role: "Programmable evaluation and agentic environments"
  - id: vllm
    title: "vLLM"
    url: "https://docs.vllm.ai/"
    role: "Inference, paging, batching, and serving experiments"

modules:
  - id: module-01-loss-semantics
    number: 1
    phase: "Construct the complete language-model training loop"
    weeks: "1-4"
    starts: "2026-08-24"
    publish_by: "2026-09-20"
    status: "planned"
    current: true
    evidence_level: "not-started"
    title: "What does next-token training actually optimize?"
    research_question: "Under padding, packing, variable sequence lengths, gradient accumulation, and data parallelism, what coefficient does every valid token receive in the update?"
    prerequisites: []
    competencies:
      - "token-normalized objectives"
      - "gradient-equivalence testing"
      - "distributed loss reduction"
    implementation_target: "Explicit loss numerator and denominator, packing and accumulation equivalence, simulated rank partitions, and a broken mean-of-means control."
    publication_gate: "Every semantics-preserving repartition must preserve the scalar objective, gradients, and one optimizer update; the broken reduction must fail."
    code_tag: "module-01-loss-semantics"
    resources: ["cs336", "tuning-playbook"]
    reports:
      - id: report-01-loss-semantics
        title: "The Two Numbers Behind Every Language-Model Loss"
        slug: "the-two-numbers-behind-every-language-model-loss"
        status: "planned"
        evidence_level: "not-started"

  - id: module-02-tokenizer-stream
    number: 2
    phase: "Construct the complete language-model training loop"
    weeks: "5-8"
    starts: "2026-09-21"
    publish_by: "2026-10-18"
    status: "planned"
    current: false
    evidence_level: "not-started"
    title: "Tokenization and the training stream"
    research_question: "How do vocabulary design and stream construction redistribute context, FLOPs, memory, and representation fidelity?"
    prerequisites: ["module-01-loss-semantics"]
    competencies:
      - "BPE implementation"
      - "tokenizer measurement"
      - "deterministic data streams"
    implementation_target: "BPE, reversible normalization, vocabulary experiments, deterministic packing, sharding, and exact stream resume."
    publication_gate: "The report must connect tokenizer decisions to measured model-system consequences and demonstrate exact iterator resume."
    code_tag: "module-02-tokenizer-stream"
    resources: ["cs336"]
    reports:
      - id: report-02-tokenizer-stream
        title: "A Tokenizer Is a Compute Allocation Policy"
        slug: "a-tokenizer-is-a-compute-allocation-policy"
        status: "planned"
        evidence_level: "not-started"

  - id: module-03-modern-decoder
    number: 3
    phase: "Construct the complete language-model training loop"
    weeks: "9-12"
    starts: "2026-10-19"
    publish_by: "2026-11-15"
    status: "planned"
    current: false
    evidence_level: "not-started"
    title: "Build a modern decoder from equations"
    research_question: "What computation and state transition does each part of a contemporary decoder implement?"
    prerequisites: ["module-01-loss-semantics", "module-02-tokenizer-stream"]
    competencies:
      - "decoder architecture"
      - "attention equivalence"
      - "KV-cache generation"
    implementation_target: "Decoder-only Transformer with RMSNorm, RoPE, SwiGLU, MHA/GQA, sampling, and cached generation."
    publication_gate: "Every forward tensor must have documented semantics, shape, FLOPs, memory traffic, and lifetime, backed by reference and cached-logit tests."
    code_tag: "module-03-modern-decoder"
    resources: ["cs336", "nanochat"]
    reports:
      - id: report-03-modern-decoder
        title: "A Modern Decoder, Derived and Tested"
        slug: "a-modern-decoder-derived-and-tested"
        status: "planned"
        evidence_level: "not-started"

  - id: module-04-reproducible-pretraining
    number: 4
