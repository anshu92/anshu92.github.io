<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Model calibration in large language models</title>
  <desc id="desc">A reliability curve falls below the perfect-calibration diagonal. A callout compares 95 percent predicted confidence with 72 percent observed accuracy, a gap of 23 percentage points.</desc>
  <defs>
    <style>
      .title { font: 700 48px system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 21px system-ui, sans-serif; fill: #475569; }
      .axis-label { font: 600 17px system-ui, sans-serif; fill: #334155; }
      .small { font: 400 15px system-ui, sans-serif; fill: #64748b; }
      .callout-title { font: 700 25px system-ui, sans-serif; fill: #991b1b; }
      .callout-gap { font: 700 20px system-ui, sans-serif; fill: #991b1b; }
      .callout-value { font: 700 38px system-ui, sans-serif; fill: #0f172a; }
      .callout-label { font: 400 17px system-ui, sans-serif; fill: #475569; }
      .footer { font: 650 22px system-ui, sans-serif; fill: #164e63; }
      .grid { stroke: #dbe3ec; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#f8fafc"/>
  <circle cx="1110" cy="72" r="170" fill="#e0f2fe" opacity="0.65"/>
  <circle cx="1030" cy="590" r="210" fill="#ffe4e6" opacity="0.45"/>

  <text x="70" y="76" class="title">Model Calibration in Large Language Models</text>
  <text x="72" y="113" class="subtitle">When a model says 80%, is it actually right 80% of the time?</text>

  <rect x="78" y="155" width="485" height="390" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <g class="grid">
    <line x1="135" y1="450" x2="505" y2="450"/><line x1="135" y1="358" x2="505" y2="358"/>
    <line x1="135" y1="266" x2="505" y2="266"/><line x1="227" y1="174" x2="227" y2="542"/>
    <line x1="320" y1="174" x2="320" y2="542"/><line x1="412" y1="174" x2="412" y2="542"/>
  </g>
  <line x1="135" y1="542" x2="505" y2="542" stroke="#334155" stroke-width="3"/>
  <line x1="135" y1="542" x2="135" y2="174" stroke="#334155" stroke-width="3"/>
  <line x1="135" y1="542" x2="505" y2="174" stroke="#64748b" stroke-width="4" stroke-dasharray="10 9"/>

  <polyline points="190,479 264,428 338,384 412,329 486,277" fill="none" stroke="#dc2626" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#ffffff" stroke="#dc2626" stroke-width="5">
    <circle cx="190" cy="479" r="9"/><circle cx="264" cy="428" r="9"/><circle cx="338" cy="384" r="9"/>
    <circle cx="412" cy="329" r="9"/><circle cx="486" cy="277" r="9"/>
  </g>
  <line x1="486" y1="192" x2="486" y2="277" stroke="#dc2626" stroke-width="3" stroke-dasharray="6 6"/>

  <text x="320" y="575" text-anchor="middle" class="axis-label">Predicted confidence</text>
  <text x="100" y="358" text-anchor="middle" class="axis-label" transform="rotate(-90 100 358)">Observed accuracy</text>
  <text x="175" y="205" class="small">perfect calibration</text>
  <text x="362" y="455" class="small" fill="#991b1b">observed</text>

  <rect x="625" y="184" width="490" height="290" rx="22" fill="#ffffff" stroke="#fda4af" stroke-width="3"/>
  <text x="670" y="230" class="callout-title">HIGH-CONFIDENCE GAP</text>
  <text x="670" y="292" class="callout-value">95%</text>
  <text x="785" y="292" class="callout-label">predicted confidence</text>
  <line x1="670" y1="317" x2="1070" y2="317" stroke="#e2e8f0" stroke-width="2"/>
  <text x="670" y="376" class="callout-value">72%</text>
  <text x="785" y="376" class="callout-label">observed accuracy</text>
  <rect x="670" y="406" width="400" height="45" rx="10" fill="#fff1f2"/>
  <text x="870" y="436" text-anchor="middle" class="callout-gap">23 percentage points overconfident</text>

  <rect x="645" y="520" width="450" height="65" rx="14" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
  <text x="870" y="560" text-anchor="middle" class="footer">A probability should mean what it says.</text>
</svg>
