<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660" role="img" aria-labelledby="title desc">
  <title id="title">Reliability diagram showing overconfidence at high predicted probabilities</title>
  <desc id="desc">Observed accuracy is plotted against mean predicted confidence for five bins. The observed line falls below the perfect calibration diagonal, ending at 72 percent accuracy for 95 percent confidence.</desc>
  <defs>
    <style>
      .title { font: 700 30px system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px system-ui, sans-serif; fill: #475569; }
      .axis-label { font: 600 17px system-ui, sans-serif; fill: #1e293b; }
      .tick { font: 400 14px system-ui, sans-serif; fill: #64748b; }
      .note-heading { font: 700 20px system-ui, sans-serif; fill: #991b1b; }
      .note { font: 400 17px system-ui, sans-serif; fill: #334155; }
      .grid { stroke: #cbd5e1; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1080" height="660" fill="#f8fafc"/>
  <text x="60" y="52" class="title">Confidence rises faster than reliability</text>
  <text x="60" y="82" class="subtitle">Points below the diagonal are overconfident; the vertical gap is the calibration error.</text>

  <rect x="160" y="110" width="480" height="480" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

  <g class="grid">
    <line x1="160" y1="494" x2="640" y2="494"/><line x1="160" y1="398" x2="640" y2="398"/>
    <line x1="160" y1="302" x2="640" y2="302"/><line x1="160" y1="206" x2="640" y2="206"/>
    <line x1="256" y1="110" x2="256" y2="590"/><line x1="352" y1="110" x2="352" y2="590"/>
    <line x1="448" y1="110" x2="448" y2="590"/><line x1="544" y1="110" x2="544" y2="590"/>
  </g>

  <line x1="160" y1="590" x2="640" y2="590" stroke="#334155" stroke-width="2"/>
  <line x1="160" y1="590" x2="160" y2="110" stroke="#334155" stroke-width="2"/>
  <line x1="160" y1="590" x2="640" y2="110" stroke="#64748b" stroke-width="3" stroke-dasharray="9 8"/>

  <g class="tick" text-anchor="middle">
    <text x="160" y="614">0.0</text><text x="256" y="614">0.2</text><text x="352" y="614">0.4</text>
    <text x="448" y="614">0.6</text><text x="544" y="614">0.8</text><text x="640" y="614">1.0</text>
  </g>
  <g class="tick" text-anchor="end">
    <text x="148" y="595">0.0</text><text x="148" y="499">0.2</text><text x="148" y="403">0.4</text>
    <text x="148" y="307">0.6</text><text x="148" y="211">0.8</text><text x="148" y="115">1.0</text>
  </g>

  <text x="400" y="646" text-anchor="middle" class="axis-label">Mean predicted confidence</text>
  <text x="50" y="350" text-anchor="middle" class="axis-label" transform="rotate(-90 50 350)">Observed accuracy</text>

  <g stroke="#dc2626" stroke-width="2" stroke-dasharray="4 5">
    <line x1="232" y1="518" x2="232" y2="508.4"/>
    <line x1="328" y1="422" x2="328" y2="441.2"/>
    <line x1="424" y1="326" x2="424" y2="383.6"/>
    <line x1="520" y1="230" x2="520" y2="311.6"/>
    <line x1="616" y1="134" x2="616" y2="244.4"/>
  </g>

  <polyline points="232,508.4 328,441.2 424,383.6 520,311.6 616,244.4" fill="none" stroke="#dc2626" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#ffffff" stroke="#dc2626" stroke-width="4">
    <circle cx="232" cy="508.4" r="7"/><circle cx="328" cy="441.2" r="7"/>
    <circle cx="424" cy="383.6" r="7"/><circle cx="520" cy="311.6" r="7"/>
    <circle cx="616" cy="244.4" r="7"/>
  </g>

  <line x1="680" y1="173" x2="625" y2="233" stroke="#991b1b" stroke-width="2"/>
  <rect x="700" y="135" width="320" height="176" rx="14" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/>
  <text x="730" y="174" class="note-heading">High-confidence gap</text>
  <text x="730" y="211" class="note">Predicted confidence: 95%</text>
  <text x="730" y="242" class="note">Observed accuracy: 72%</text>
  <text x="730" y="273" class="note">Overconfidence: 23 points</text>

  <line x1="720" y1="405" x2="760" y2="365" stroke="#64748b" stroke-width="3" stroke-dasharray="9 8"/>
  <text x="775" y="371" class="note">Perfect calibration</text>
  <line x1="720" y1="455" x2="760" y2="455" stroke="#dc2626" stroke-width="5"/>
  <circle cx="740" cy="455" r="6" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
  <text x="775" y="461" class="note">Observed model</text>
</svg>
