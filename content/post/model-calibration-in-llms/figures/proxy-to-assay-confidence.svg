<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Scientific proxy scores require outcome-specific calibration</title>
  <desc id="desc">Agent votes, model likelihoods, structure confidence, and energy scores feed an uncertainty estimator. A calibrator fitted on held-out physical experiments maps the raw score to the probability of a named assay outcome, which then drives a test, review, or stop decision.</desc>
  <defs>
    <style>
      .title { font: 700 31px system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px system-ui, sans-serif; fill: #475569; }
      .head { font: 700 21px system-ui, sans-serif; fill: #0f172a; }
      .label { font: 600 16px system-ui, sans-serif; fill: #334155; }
      .small { font: 400 14px system-ui, sans-serif; fill: #64748b; }
      .math { font: 650 19px system-ui, sans-serif; fill: #164e63; }
      .prob { font: 750 28px system-ui, sans-serif; fill: #166534; }
      .warning { font: 650 17px system-ui, sans-serif; fill: #991b1b; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="#f8fafc"/>
  <circle cx="1140" cy="55" r="150" fill="#dcfce7" opacity="0.55"/>
  <text x="52" y="58" class="title">A score becomes a probability only after calibration</text>
  <text x="52" y="88" class="subtitle">Fit the mapping on held-out physical outcomes, then test it on future candidates from the same workflow.</text>

  <rect x="48" y="130" width="286" height="402" rx="18" fill="#ffffff" stroke="#a5b4fc" stroke-width="2"/>
  <text x="72" y="169" class="head">Raw proxy signals</text>
  <text x="72" y="194" class="small">Useful for ranking; no shared scale</text>
  <g>
    <rect x="72" y="224" width="238" height="48" rx="10" fill="#eef2ff"/>
    <text x="91" y="254" class="label">LLM judge rank</text>
    <rect x="72" y="286" width="238" height="48" rx="10" fill="#eef2ff"/>
    <text x="91" y="316" class="label">Agent agreement</text>
    <rect x="72" y="348" width="238" height="48" rx="10" fill="#eff6ff"/>
    <text x="91" y="378" class="label">Sequence likelihood</text>
    <rect x="72" y="410" width="238" height="48" rx="10" fill="#ecfeff"/>
    <text x="91" y="440" class="label">Structure confidence</text>
    <rect x="72" y="472" width="238" height="48" rx="10" fill="#f5f3ff"/>
    <text x="91" y="502" class="label">Energy / simulation score</text>
  </g>

  <line x1="334" y1="330" x2="392" y2="330" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="396" y="184" width="352" height="294" rx="20" fill="#ffffff" stroke="#67e8f9" stroke-width="3"/>
  <text x="426" y="229" class="head">Outcome-specific calibrator</text>
  <text x="426" y="264" class="small">1. Combine signals into raw score s</text>
  <rect x="426" y="282" width="292" height="55" rx="11" fill="#ecfeff"/>
  <text x="572" y="316" text-anchor="middle" class="math">s = g(proxy signals)</text>
  <text x="426" y="373" class="small">2. Fit on held-out experimental labels</text>
  <rect x="426" y="391" width="292" height="55" rx="11" fill="#ecfeff"/>
  <text x="572" y="425" text-anchor="middle" class="math">c = f(s) ≈ P(Y = 1 | s)</text>

  <path d="M572 548 C572 518 572 503 572 478" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="396" y="548" width="352" height="80" rx="14" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="572" y="579" text-anchor="middle" class="label">Historical physical experiments</text>
  <text x="572" y="606" text-anchor="middle" class="small">assay protocol + threshold + observed result</text>

  <line x1="748" y1="330" x2="806" y2="330" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="810" y="130" width="342" height="402" rx="18" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="838" y="169" class="head">Named probability</text>
  <text x="838" y="211" class="small">For example:</text>
  <text x="981" y="260" text-anchor="middle" class="prob">P(assay positive) = c</text>
  <line x1="838" y1="288" x2="1124" y2="288" stroke="#e2e8f0" stroke-width="2"/>
  <text x="838" y="326" class="head">Decision policy</text>
  <rect x="838" y="348" width="286" height="45" rx="9" fill="#f0fdf4"/>
  <text x="981" y="376" text-anchor="middle" class="label">test candidate</text>
  <rect x="838" y="404" width="286" height="45" rx="9" fill="#fffbeb"/>
  <text x="981" y="432" text-anchor="middle" class="label">seek review or information</text>
  <rect x="838" y="460" width="286" height="45" rx="9" fill="#fff1f2"/>
  <text x="981" y="488" text-anchor="middle" class="label">defer or stop</text>

  <rect x="48" y="656" width="1104" height="42" rx="10" fill="#fff1f2" stroke="#fda4af"/>
  <text x="600" y="683" text-anchor="middle" class="warning">Calibrated assay confidence is not calibrated toxicity, in vivo efficacy, or clinical success.</text>
</svg>
